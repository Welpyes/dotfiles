# hyprpaper configuration
#
# Hyprland cannot draw a wallpaper itself -- hyprpaper is the daemon that does.
# Started from wallpaper.lua on hyprland.start, so this file is only read at
# session start.
#
# See https://wiki.hypr.land/Hypr-Ecosystem/User/hyprpaper/

# An empty monitor makes this the fallback for any output without a specific
# entry, which is what you want for a single-monitor or unknown-output setup.
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/Suicool.jpg
    # cover fills the screen while preserving the aspect ratio; fill would
    # distort the image.
    fit_mode = cover
}

# Do not draw the Hyprland splash logo on top of a real wallpaper.
splash = false
